services:
  searxng:
    image: searxng/searxng:latest
    container_name: devs-search
    volumes:
      # Mounted read-write: the image entrypoint rewrites secret_key from
      # SEARXNG_SECRET and chowns the file at startup.
      - ./settings.yml:/etc/searxng/settings.yml
    environment:
      # Overrides `server.secret_key` from settings.yml. Set in a .env file
      # next to this compose file; never commit a real value.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change-me-in-production}
    restart: unless-stopped
    networks:
      external:
        # Canonical production hostname is the container_name `devs-search`.
        # Keep `searxng` as a backwards-compatible alias for older proxies.
        aliases:
          - searxng

networks:
  external:
    external: true
